<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>litmapr</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <!-- Icon set: one glyph per kind of entity, drawn as HUD line art. -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-character" viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="3.8"/><path d="M4.5 20.5c1.4-4 4.2-5.8 7.5-5.8s6.1 1.8 7.5 5.8"/><path d="M2 6V2h4M22 6V2h-4" /></symbol>
    <symbol id="i-device" viewBox="0 0 24 24"><path d="M12 2.5l8.2 4.75v9.5L12 21.5l-8.2-4.75v-9.5z"/><circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v3.3M12 18.2v3.3"/></symbol>
    <symbol id="i-concept" viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="9.5" ry="3.6"/><ellipse cx="12" cy="12" rx="9.5" ry="3.6" transform="rotate(60 12 12)"/><ellipse cx="12" cy="12" rx="9.5" ry="3.6" transform="rotate(120 12 12)"/><circle cx="12" cy="12" r="1.3" fill="currentColor"/></symbol>
    <symbol id="i-location" viewBox="0 0 24 24"><circle cx="12" cy="12" r="6.5"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><path d="M12 1.5v5M12 17.5v5M1.5 12h5M17.5 12h5"/></symbol>
    <symbol id="i-faction" viewBox="0 0 24 24"><path d="M12 2l8 3v6.2c0 5-3.4 8.6-8 10.8-4.6-2.2-8-5.8-8-10.8V5z"/><path d="M8 10l4 3 4-3"/></symbol>
    <symbol id="i-event" viewBox="0 0 24 24"><path d="M12 1.8l2.6 7.6 7.6 2.6-7.6 2.6L12 22.2l-2.6-7.6L1.8 12l7.6-2.6z"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5l6 6"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M5 5l14 14M19 5L5 19"/></symbol>
  </svg>

  <div class="field" aria-hidden="true"></div>
  <div id="graph" aria-label="3D story map. Click a marker to open its dossier."></div>
  <div id="markers" class="markers"></div>

  <header class="top">
    <a class="brand" href="/" aria-label="litmapr home">
      <span class="brand-mark"></span>litmapr
    </a>

    <div class="scrubber" id="scrubber">
      <label for="upto" class="scrub-label">Read up to</label>
      <div class="scrub-track">
        <input id="upto" type="range" min="0" max="0" value="0" step="1" aria-describedby="upto-value">
        <div id="ticks" class="ticks" aria-hidden="true"></div>
      </div>
      <output id="upto-value" class="scrub-value">Everything</output>
    </div>

    <form class="find" id="find" role="search">
      <svg class="icon" aria-hidden="true"><use href="#i-search"/></svg>
      <input id="search" type="search" placeholder="Find a character, place or idea" list="names" autocomplete="off" aria-label="Find in the map">
      <datalist id="names"></datalist>
    </form>
  </header>

  <nav class="rail" id="rail" aria-label="Show or hide kinds of entities"></nav>

  <footer class="status">
    <span id="status-text">Loading the map</span>
    <label class="depth"><input id="timeline" type="checkbox"> Timeline depth</label>
  </footer>

  <section id="empty" class="empty" hidden>
    <div class="empty-ring" aria-hidden="true"></div>
    <h2 id="empty-title">The map is empty</h2>
    <p id="empty-text">Add a comic with <code>uv run litmapr add yourcomic.cbz</code>, then reload this page.</p>
  </section>

  <aside id="dossier" class="dossier" aria-labelledby="d-name" hidden>
    <span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>
    <button id="close" class="close" aria-label="Close dossier"><svg class="icon"><use href="#i-close"/></svg></button>

    <div class="d-head">
      <div class="portrait" id="d-portrait">
        <svg class="portrait-ring" viewBox="0 0 120 120" aria-hidden="true">
          <circle cx="60" cy="60" r="56" class="ring-outer"/>
          <circle cx="60" cy="60" r="49" class="ring-ticks"/>
        </svg>
        <img id="d-img" alt="" hidden>
        <svg id="d-glyph" class="portrait-glyph"><use href="#i-character"/></svg>
      </div>
      <div class="d-id">
        <p class="d-kind" id="d-kind"></p>
        <h2 id="d-name"></h2>
        <p class="d-aliases" id="d-aliases"></p>
        <p class="d-file" id="d-file"></p>
        <div class="pic-tools" id="pic-tools" hidden>
          <button class="pic-btn" id="pic-replace" type="button">Replace picture</button>
          <button class="pic-btn" id="pic-remove" type="button">Remove picture</button>
          <input type="file" id="pic-file" accept="image/*" hidden>
          <span class="pic-status" id="pic-status" aria-live="polite"></span>
        </div>
      </div>
    </div>

    <p class="d-description" id="d-description"></p>

    <dl class="stats" id="d-stats"></dl>

    <div class="presence">
      <p class="presence-label" id="d-first"></p>
      <div class="presence-strip" id="d-presence" role="img"></div>
    </div>

    <div class="tabs" role="tablist" aria-label="Dossier sections">
      <button role="tab" id="tab-plot" aria-controls="pane-plot" aria-selected="true">Plot points</button>
      <button role="tab" id="tab-links" aria-controls="pane-links" aria-selected="false">Connections</button>
      <button role="tab" id="tab-callbacks" aria-controls="pane-callbacks" aria-selected="false">Callbacks</button>
      <button role="tab" id="tab-narrator" aria-controls="pane-narrator" aria-selected="false">Narrator</button>
      <span class="tab-bar" id="tab-bar" aria-hidden="true"></span>
    </div>

    <div class="panes">
      <ol role="tabpanel" id="pane-plot" aria-labelledby="tab-plot" class="plot"></ol>
      <div role="tabpanel" id="pane-links" aria-labelledby="tab-links" class="links" hidden></div>
      <ul role="tabpanel" id="pane-callbacks" aria-labelledby="tab-callbacks" class="callbacks" hidden></ul>
      <div role="tabpanel" id="pane-narrator" aria-labelledby="tab-narrator" class="narrator" hidden>
        <p class="narrator-note" id="narrator-note">The narrator tells you about this entry using only what the map knows up to your reading point. No spoilers.</p>
        <div class="narrator-bar">
          <button id="narrate" class="cta" type="button">Narrate</button>
          <select id="n-style" aria-label="Narrator style">
            <option value="storyteller">Storyteller</option>
            <option value="briefing">Field briefing</option>
          </select>
          <button id="n-voice-on" class="pill" type="button" aria-pressed="true">Voice on</button>
          <span class="voice-meter" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
        </div>
        <label class="voice-row" id="voice-row">Voice <select id="n-voice"></select></label>
        <div id="narration" class="narration" aria-live="polite"></div>
      </div>
    </div>
  </aside>

  <script src="/static/vendor/3d-force-graph.min.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
